name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Reject broken Vietnamese text
        shell: pwsh
        run: |
          $files = Get-ChildItem RetailPrint -Recurse -File |
            Where-Object { $_.Extension -in '.cs', '.xaml' }
          $badCodePoints = @(
            [char]0x00C3,
            [char]0x00C4,
            [char]0x00C6,
            [char]0xFFFD
          )
          $bad = foreach ($file in $files) {
            $text = Get-Content -Raw -Encoding UTF8 $file.FullName
            foreach ($char in $badCodePoints) {
              if ($text.Contains([string]$char)) {
                [pscustomobject]@{ Path = $file.FullName; Character = ('U+{0:X4}' -f [int]$char) }
              }
            }
            foreach ($code in 0x80..0x9F) {
              if ($text.Contains([string][char]$code)) {
                [pscustomobject]@{ Path = $file.FullName; Character = ('U+{0:X4}' -f $code) }
              }
            }
          }
          if ($bad) {
            $bad | Sort-Object Path, Character -Unique | Format-Table -AutoSize
            throw 'Phát hiện chuỗi tiếng Việt bị sai mã hóa.'
          }

      - name: Restore
        run: dotnet restore .\RetailPrint\RetailPrint.csproj

      - name: Build
        run: dotnet build .\RetailPrint\RetailPrint.csproj -c Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\RetailPrint\RetailPrint.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -o .\publish\win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\publish\win-x64\RetailPrint.exe)) {
            throw 'Không tạo được RetailPrint.exe.'
          }

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $exe = Resolve-Path .\publish\win-x64\RetailPrint.exe
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill($true)
            throw 'RetailPrint.exe bị treo khi smoke-test thành công.'
          }
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'RetailPrint\Logs\startup.log'
            if (Test-Path $log) {
              Get-Content $log -Tail 160
            }
            throw "RetailPrint.exe không khởi động được. Mã $($process.ExitCode)"
          }

          $log = Join-Path $env:LOCALAPPDATA 'RetailPrint\Logs\startup.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:RETAIL_PRINT_SMOKE_FORCE_FAILURE = '1'
          try {
            $failure = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $failure.WaitForExit(10000)) {
              $failure.Kill($true)
              throw 'Smoke-test lỗi đã mở giao diện hoặc bị treo thay vì thoát không tương tác.'
            }
            if ($failure.ExitCode -eq 0) {
              throw 'Smoke-test lỗi phải trả mã khác 0.'
            }
          }
          finally {
            Remove-Item Env:RETAIL_PRINT_SMOKE_FORCE_FAILURE -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $log)) {
            throw 'Smoke-test lỗi không ghi nhật ký khởi động.'
          }

      - name: Probe real packaged startup
        shell: pwsh
        run: |
          $exe = Resolve-Path .\publish\win-x64\RetailPrint.exe
          $log = Join-Path $env:LOCALAPPDATA 'RetailPrint\Logs\startup.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList '--startup-probe' -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill($true)
            throw 'RetailPrint.exe bị treo trên đường khởi động thật.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 160
            }
            throw "RetailPrint.exe lỗi trên đường khởi động thật. Mã $($process.ExitCode)"
          }

      - name: Build per-user installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw 'Windows runner không có Inno Setup 6.'
          }
          & $iscc "/DMyAppVersion=2.0.$env:GITHUB_RUN_NUMBER" .\installer\RetailPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\publish\installer\RetailPrint-Setup-win-x64.exe)) {
            throw 'Không tạo được RetailPrint-Setup-win-x64.exe.'
          }

      - name: Install, open and uninstall built installer
        shell: pwsh
        run: |
          $installer = Resolve-Path .\publish\installer\RetailPrint-Setup-win-x64.exe
          $installDir = Join-Path $env:LOCALAPPDATA 'RetailPrint-CI-Installed'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$installDir"
          ) -PassThru
          if (-not $install.WaitForExit(30000)) {
            $install.Kill($true)
            throw 'Bộ cài Retail Print bị treo khi cài đặt.'
          }
          if ($install.ExitCode -ne 0) {
            throw "Bộ cài Retail Print trả mã lỗi $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDir 'RetailPrint.exe'
          if (-not (Test-Path $installedExe)) {
            throw 'Bộ cài chạy xong nhưng không có RetailPrint.exe trong thư mục cài.'
          }

          $log = Join-Path $env:LOCALAPPDATA 'RetailPrint\Logs\startup.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $installedExe -ArgumentList '--startup-probe' -PassThru
          if (-not $app.WaitForExit(20000)) {
            $app.Kill($true)
            throw 'Retail Print bản đã cài bị treo khi mở.'
          }
          if ($app.ExitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 160
            }
            throw "Retail Print bản đã cài không mở được. Mã $($app.ExitCode)"
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) {
            throw 'Không tìm thấy chương trình gỡ cài đặt.'
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART'
          ) -PassThru
          if (-not $uninstall.WaitForExit(30000)) {
            $uninstall.Kill($true)
            throw 'Bộ gỡ Retail Print bị treo.'
          }
          if ($uninstall.ExitCode -ne 0) {
            throw "Bộ gỡ Retail Print trả mã lỗi $($uninstall.ExitCode)."
          }

      - name: Upload Retail Print package
        uses: actions/upload-artifact@v6
        with:
          name: RetailPrint-win-x64
          path: |
            publish/win-x64/RetailPrint.exe
            publish/installer/RetailPrint-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
